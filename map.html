<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASCAR Cup Series Track Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">
    <span class="mark">CUP<span class="accent-dot">&middot;</span>ATLAS</span>
    <span class="sub">NASCAR Cup Series, 1949&ndash;2025</span>
  </a>
  <nav class="tabs">
    <a class="tab" href="index.html">Report</a>
    <a class="tab" href="dashboard.html">Dashboard</a>
    <a class="tab active" href="map.html">Track Map</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.7A8.5 8.5 0 0 1 9.3 3.6a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
  </button>
</header>

<div id="view-map-page">
  <div class="map-layout" id="mapLayout">
    <aside class="track-list-panel" id="trackListPanel">
      <div class="panel-head">
        <h2>Tracks</h2>
        <input type="search" id="trackSearch" placeholder="Search by name or city&hellip;" aria-label="Search tracks">
      </div>
      <div class="track-list" id="trackList"></div>
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse track list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </aside>
    <div class="map-wrap">
      <svg id="usMap" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the United States with a marker for every NASCAR Cup Series track"></svg>
      <div class="map-hint">Scroll to zoom &middot; drag to pan &middot; click a track</div>
      <div class="map-legend"><span class="legend-mark"></span><strong style="display:inline">Marker size</strong><br>Races hosted at that track. Zoom in on a cluster to spread markers apart and reveal names.<br><span class="has-outline-dot" style="position:static;display:inline-block;"></span> Track list entries with this dot have a known track outline.</div>
      <aside class="detail-panel" id="detailPanel" hidden>
        <div class="detail-panel-actions">
          <button id="expandDetail" type="button" aria-label="Expand to full page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
          <button id="closeDetail" type="button" aria-label="Close">&times;</button>
        </div>
        <div id="detailContent"></div>
      </aside>
    </div>
  </div>
</div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson.min.js"></script>
<script>
(async function () {
  "use strict";

  const [tracks, us, trackShapes] = await Promise.all([
    fetch('data/tracks.json').then(r => r.json()),
    fetch('data/us-states-10m.json').then(r => r.json()),
    fetch('data/track_shapes.json').then(r => r.json())
  ]);

  const svg = d3.select('#usMap');
  const projection = d3.geoAlbersUsa().scale(1250).translate([487.5, 305]);
  const path = d3.geoPath(projection);
  const zoomLayer = svg.append('g');

  const statesGeo = topojson.feature(us, us.objects.states).features;
  zoomLayer.append('g').attr('class', 'states')
    .selectAll('path').data(statesGeo).join('path')
    .attr('class', 'state').attr('d', path);

  const maxRaces = d3.max(tracks, t => t.numRaces);
  // marker WIDTH by race count (sqrt scale for perceptual area); height is a
  // fixed fraction of width, giving a small "track oval" (stadium) shape.
  const wScale = d3.scaleSqrt().domain([1, maxRaces]).range([7, 30]);
  const hRatio = 0.42;

  const pinsG = zoomLayer.append('g').attr('class', 'pins');
  const pinGroups = pinsG.selectAll('g').data(tracks).join('g')
    .attr('class', 'pin-group')
    .attr('tabindex', 0)
    .attr('role', 'button')
    .attr('aria-label', t => t.name + ', ' + t.numRaces + ' races')
    .attr('data-x', t => (projection([t.lon, t.lat]) || [-1000, -1000])[0])
    .attr('data-y', t => (projection([t.lon, t.lat]) || [-1000, -1000])[1])
    .on('click', (ev, t) => selectTrack(t))
    .on('keydown', (ev, t) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectTrack(t); } });

  pinGroups.each(function (t) {
    const w = wScale(t.numRaces), h = w * hRatio;
    d3.select(this).append('rect')
      .attr('class', 'pin-mark')
      .attr('width', w).attr('height', h)
      .attr('x', -w / 2).attr('y', -h / 2)
      .attr('rx', h / 2).attr('ry', h / 2);
  });
  pinGroups.append('title').text(t => t.name + ' (' + t.numRaces + (t.numRaces === 1 ? ' race)' : ' races)'));
  const pinLabels = pinGroups.append('text')
    .attr('class', 'pin-label')
    .attr('x', t => wScale(t.numRaces) / 2 + 5)
    .attr('y', 3.5)
    .text(t => t.name);

  function positionPins(k) {
    // counter-scale each marker's own size by 1/k so markers stay a constant
    // screen size as the outer zoom transform scales everything else up -
    // this is what actually spreads dense clusters (like North Carolina)
    // apart into individually-clickable markers as you zoom in.
    pinGroups.attr('transform', function () {
      const el = d3.select(this);
      const x = +el.attr('data-x'), y = +el.attr('data-y');
      return 'translate(' + x + ',' + y + ') scale(' + (1 / k) + ')';
    });
    pinLabels.classed('visible', k >= 3.2);
  }
  positionPins(1);

  const zoom = d3.zoom().scaleExtent([1, 14]).on('zoom', (ev) => {
    zoomLayer.attr('transform', ev.transform);
    positionPins(ev.transform.k);
  });
  svg.call(zoom);
  svg.on('dblclick.zoom', null);
  svg.on('dblclick', () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity));

  const detailPanel = document.getElementById('detailPanel');
  const detailContent = document.getElementById('detailContent');
  document.getElementById('closeDetail').addEventListener('click', () => { detailPanel.hidden = true; detailPanel.classList.remove('expanded'); clearSelection(); });

  const expandBtn = document.getElementById('expandDetail');
  expandBtn.addEventListener('click', () => {
    const expanded = detailPanel.classList.toggle('expanded');
    expandBtn.setAttribute('aria-label', expanded ? 'Collapse to sidebar' : 'Expand to full page');
    expandBtn.innerHTML = expanded
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5a2 2 0 0 1-2 2H2M15 3v5a2 2 0 0 0 2 2h5M15 21v-5a2 2 0 0 1 2-2h5M9 21v-5a2 2 0 0 0-2-2H2"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
    renderDetailTable(lastSelectedTrack, expanded);
  });

  const sidebarToggle = document.getElementById('sidebarToggle');
  const mapLayout = document.getElementById('mapLayout');
  sidebarToggle.addEventListener('click', () => {
    const collapsed = mapLayout.classList.toggle('sidebar-collapsed');
    sidebarToggle.setAttribute('aria-label', collapsed ? 'Expand track list' : 'Collapse track list');
  });

  function clearSelection() { pinGroups.classed('selected', false); document.querySelectorAll('.track-row.selected').forEach(r => r.classList.remove('selected')); }

  const moneyFmt = v => { const n = Number(String(v).replace(/,/g, '')); return n ? '$' + n.toLocaleString('en-US') : '&mdash;'; };

  let lastSelectedTrack = null;

  function renderDetailTable(t, expanded) {
    if (!t) return;
    const rows = t.races.slice().reverse().map(r => {
      const basic =
        '<td>' + r.year + '</td><td>' + (r.date || '') + '</td>' +
        '<td class="winner">' + (r.winner || '&mdash;') + '</td>' +
        '<td>' + (r.purse ? moneyFmt(r.purse) : '&mdash;') + '</td>' +
        '<td>' + (r.poleSpeed && r.poleSpeed !== 'NTT' ? r.poleSpeed : '&mdash;') + '</td>' +
        '<td>' + (r.avgSpeed || '&mdash;') + '</td>' +
        '<td>' + (r.cautions || '0') + '</td>';
      const extra = expanded ?
        '<td>' + (r.manufacturer || '&mdash;') + '</td>' +
        '<td>' + (r.startPos || '&mdash;') + '</td>' +
        '<td>' + (r.leadChanges || '0') + '</td>' +
        '<td>' + (r.surface === 'paved' ? 'Paved' : r.surface === 'road' ? 'Road' : r.surface || '&mdash;') + '</td>' +
        '<td>' + (r.cars || '&mdash;') + '</td>' : '';
      return '<tr>' + basic + extra + '</tr>';
    }).join('');
    const extraHead = expanded ? '<th>Make</th><th>Pole St.</th><th>Lead Chg</th><th>Surface</th><th>Cars</th>' : '';

    const tableEl = detailContent.querySelector('table');
    if (tableEl) {
      detailContent.querySelector('.table-scroll-outer').innerHTML =
        '<table class="race-history-table"><thead><tr>' +
        '<th>Yr</th><th>Date</th><th>Winner</th><th>Purse</th><th>Pole mph</th><th>Avg mph</th><th>Cau</th>' + extraHead +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }
  }

  function selectTrack(t) {
    clearSelection();
    lastSelectedTrack = t;
    pinGroups.filter(d => d === t).classed('selected', true);
    const row = document.querySelector('.track-row[data-name="' + CSS.escape(t.name) + '"]');
    if (row) row.classList.add('selected');

    const shape = trackShapes[t.name];
    const outlineHtml = shape ?
      '<div class="track-outline"><svg viewBox="0 0 200 100" aria-hidden="true"><path d="' + shape.path + '"/></svg></div>' :
      '<div class="track-outline track-outline-missing">No outline on record for this track yet</div>';

    detailContent.innerHTML =
      '<h2>' + t.name + '</h2>' +
      (t.akaNames.length ? '<div class="detail-aka">Formerly: ' + t.akaNames.join(', ') + '</div>' : '') +
      outlineHtml +
      '<div class="detail-meta">' +
        '<div><b>' + t.location + '</b>Location</div>' +
        '<div><b>' + t.numRaces + '</b>Cup races</div>' +
        '<div><b>' + t.firstRace + '&ndash;' + t.lastRace + '</b>Span</div>' +
      '</div>' +
      '<div class="table-scroll-outer"><table></table></div>';
    renderDetailTable(t, detailPanel.classList.contains('expanded'));
    detailPanel.hidden = false;
  }

  const trackListEl = document.getElementById('trackList');
  const sortedTracks = tracks.slice().sort((a, b) => b.numRaces - a.numRaces);
  function renderTrackList(filterStr) {
    const f = (filterStr || '').toLowerCase().trim();
    const list = f ? sortedTracks.filter(t => t.name.toLowerCase().includes(f) || t.location.toLowerCase().includes(f)) : sortedTracks;
    trackListEl.innerHTML = list.map(t =>
      '<button class="track-row" data-name="' + t.name.replace(/"/g, '&quot;') + '">' +
        '<span class="n">' + (trackShapes[t.name] ? '<span class="has-outline-dot" title="Outline available"></span>' : '') + t.name + '</span>' +
        '<span class="c">' + t.numRaces + '</span>' +
      '</button>'
    ).join('');
    trackListEl.querySelectorAll('.track-row').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = tracks.find(x => x.name === btn.dataset.name);
        if (t) selectTrack(t);
      });
    });
  }
  renderTrackList('');
  document.getElementById('trackSearch').addEventListener('input', (e) => renderTrackList(e.target.value));
})();
</script>
</body>
</html>
